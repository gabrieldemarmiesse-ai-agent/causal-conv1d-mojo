<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>causal-conv1d-mojo — JIT, cache, and the torch stream</title>
<style>
  :root {
    --bg: #F2F4F8;
    --panel: #FFFFFF;
    --panel-2: #E9EDF4;
    --line: #D6DDE9;
    --line-soft: #E3E8F1;
    --ink: #1A2233;
    --muted: #5A6780;
    --amber: #B87514;
    --amber-soft: #E9D9BC;
    --go: #0F8F76;
    --mm: #2F6FD6;
    --norm: #7A4FD0;
    --drain: #C2543C;
    --code-bg: #EDF0F6;
    --shadow: 0 1px 2px rgba(20, 30, 55, .06), 0 8px 24px rgba(20, 30, 55, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0D1220; --panel: #131A2C; --panel-2: #182136; --line: #263049;
      --line-soft: #1D2740; --ink: #E8ECF6; --muted: #93A0BC;
      --amber: #F0A63C; --amber-soft: #4a3a1c; --go: #45C6B8;
      --mm: #6FA8FF; --norm: #B08CFF; --drain: #FF7A63; --code-bg: #101728;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="light"] {
    --bg: #F2F4F8; --panel: #FFFFFF; --panel-2: #E9EDF4; --line: #D6DDE9;
    --line-soft: #E3E8F1; --ink: #1A2233; --muted: #5A6780;
    --amber: #B87514; --amber-soft: #E9D9BC; --go: #0F8F76;
    --mm: #2F6FD6; --norm: #7A4FD0; --drain: #C2543C; --code-bg: #EDF0F6;
    --shadow: 0 1px 2px rgba(20,30,55,.06), 0 8px 24px rgba(20,30,55,.07);
  }
  :root[data-theme="dark"] {
    --bg: #0D1220; --panel: #131A2C; --panel-2: #182136; --line: #263049;
    --line-soft: #1D2740; --ink: #E8ECF6; --muted: #93A0BC;
    --amber: #F0A63C; --amber-soft: #4a3a1c; --go: #45C6B8;
    --mm: #6FA8FF; --norm: #B08CFF; --drain: #FF7A63; --code-bg: #101728;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1500px; margin: 0 auto; padding: 18px 20px 40px; }

  .stage-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;
  }
  .stage-wrap { position: relative; }
  canvas#stage { display: block; width: 100%; height: 620px; }
  @media (max-width: 900px) { canvas#stage { height: 480px; } }

  .stage-card:fullscreen { display: flex; flex-direction: column; border-radius: 0; border: none; }
  .stage-card:fullscreen .stage-wrap { flex: 1 1 auto; min-height: 0; }
  .stage-card:fullscreen canvas#stage { height: 100%; }
  .stage-card:fullscreen .hud { font-size: 14px; }
  .stage-card.pseudo-full { position: fixed; inset: 0; z-index: 60;
    display: flex; flex-direction: column; border-radius: 0; }
  .stage-card.pseudo-full .stage-wrap { flex: 1 1 auto; min-height: 0; }
  .stage-card.pseudo-full canvas#stage { height: 100%; }
  .stage-card.pseudo-full .hud { font-size: 14px; }

  .hud {
    position: absolute; top: 10px; right: 16px;
    display: flex; gap: 18px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px; color: var(--muted);
    font-variant-numeric: tabular-nums;
    pointer-events: none; flex-wrap: wrap;
  }
  .hud span b { color: var(--ink); font-weight: 600; margin-left: 6px; }

  .play-overlay {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 55%, transparent);
    backdrop-filter: blur(2px);
  }
  .play-overlay.visible { display: flex; }
  .play-overlay button {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px; padding: 12px 22px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--ink); cursor: pointer; box-shadow: var(--shadow);
  }
  .play-overlay p { position: absolute; bottom: 18px; font-size: 12.5px; color: var(--muted); margin: 0; }

  .stage-controls {
    border-top: 1px solid var(--line);
    padding: 10px 16px;
    display: flex; gap: 8px; align-items: center;
  }
  .stage-controls .spacer { flex: 1 1 auto; }
  .stage-controls .note {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; color: var(--muted);
  }
  .controls { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
  .controls button {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); border-radius: 8px;
    padding: 6px 10px; cursor: pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .controls button:hover { color: var(--ink); border-color: var(--muted); }
  .controls button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .controls button[aria-pressed="true"] { color: var(--ink); border-color: var(--amber); background: var(--amber-soft); }

  .legend {
    display: flex; gap: 16px; flex-wrap: wrap;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px; color: var(--muted);
    margin: 14px 2px 0;
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 13px; height: 13px; border-radius: 4px; display: inline-block; }
  .sw.card { background: var(--panel-2); border: 1.5px solid var(--amber); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage-card" id="stageCard">
    <div class="stage-wrap">
      <canvas id="stage" aria-label="Animated diagram: PyTorch calls causal_conv1d_fn; the python wrapper reads the tensors' dtype, width and flags into a set of -D compiler defines, checks an in-process lru cache and an on-disk .so cache, JIT-compiles a new variant with mojo build on a miss, then passes the raw data pointers and torch's CUDA stream into the loaded Mojo extension, which enqueues the kernel on that same stream alongside every other torch kernel. Changing one flag compiles a second .so; restarting python reloads from disk without compiling."></canvas>
      <div class="hud" id="hud" aria-hidden="true">
        <span>compiles<b id="hud-compiles">0</b></span>
        <span>.so on disk<b id="hud-so">0</b></span>
        <span>lru hits<b id="hud-lru">0</b></span>
        <span>disk hits<b id="hud-disk">0</b></span>
        <span>launches<b id="hud-launch">0</b></span>
      </div>
      <div class="play-overlay" id="playOverlay">
        <button id="bigPlay" type="button">▶&nbsp; play animation</button>
        <p>Paused because your system prefers reduced motion.</p>
      </div>
    </div>
    <div class="stage-controls">
      <span class="note" id="stageNote">cold start — no cache for this machine yet</span>
      <span class="spacer"></span>
      <div class="controls">
        <button id="btnPlay" type="button" aria-pressed="true" title="play / pause">⏸ pause</button>
        <button id="btnSpeed" type="button" title="animation speed">1×</button>
        <button id="btnRestart" type="button" title="restart from a cold cache">↺ restart</button>
        <button id="btnFull" type="button" title="fullscreen — best for recording">⛶ fullscreen</button>
      </div>
    </div>
  </div>
  <div class="legend">
    <span><span class="sw" style="background:var(--amber)"></span>-D defines · compile</span>
    <span><span class="sw" style="background:var(--norm)"></span>runtime args — data_ptr · strides · stream</span>
    <span><span class="sw" style="background:var(--mm)"></span>conv1d kernel</span>
    <span><span class="sw" style="background:var(--muted)"></span>other torch kernels (same stream)</span>
    <span><span class="sw card"></span>compiled .so on disk</span>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- theme tokens ---------- */
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");
  let T = {};
  function readTokens() {
    const s = getComputedStyle(document.documentElement);
    const g = (n) => s.getPropertyValue(n).trim();
    T = {
      bg: g("--panel"), panel2: g("--panel-2"), line: g("--line"),
      lineSoft: g("--line-soft"), ink: g("--ink"), muted: g("--muted"),
      amber: g("--amber"), amberSoft: g("--amber-soft"), go: g("--go"),
      drain: g("--drain"), codeBg: g("--code-bg"),
      mm: g("--mm"), norm: g("--norm"),
    };
  }
  readTokens();
  new MutationObserver(readTokens).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (window.matchMedia) {
    try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTokens); } catch (e) {}
  }

  /* ---------- helpers ---------- */
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeInOut = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const glide = (cur, target, dt, rate) => cur + (target - cur) * (1 - Math.exp(-dt * rate));
  const qBezier = (p0, p1, p2, t) => {
    const u = 1 - t;
    return { x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x,
             y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y };
  };
  function withAlpha(hex, a) {
    if (hex[0] !== "#") return hex;
    let h = hex.slice(1);
    if (h.length === 3) h = h.split("").map(c => c + c).join("");
    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  const MONO = "px ui-monospace, Menlo, Consolas, monospace";
  const fpx = (n, w) => (w ? w + " " : "") + (n * L.s).toFixed(2) + MONO;

  /* ---------- layout: one row, left to right ----------
     code | wrapper -> defines | lru (disk shelf below) | mojo build (above) |
     variant .so (mojo) | torch cuda stream | GPU                          */
  let W = 0, H = 0, dpr = 1;
  const L = {};
  function relayout() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const s = clamp(W / 1250, 0.7, 1.9);
    L.s = s;
    L.lineH = 15 * s;
    const band = H * 0.50;
    L.band = band;
    L.code = { x0: W * 0.015, x1: W * 0.205, y0: H * 0.09 };
    L.code.y1 = Math.min(H * 0.92, L.code.y0 + (17 * 15 + 30) * s);
    L.wrapper = { x: W * 0.272, y: band, w: 104 * s, h: 48 * s };
    L.lru     = { x: W * 0.398, y: band, w: 88 * s, h: 48 * s };
    L.strip   = { x0: W * 0.225, x1: W * 0.465, y: band + 62 * s };
    L.shelf   = { x0: W * 0.225, x1: W * 0.475, y: H * 0.82, h: 58 * s };
    L.compiler = { x: W * 0.47, y: H * 0.17, r: 15 * s };
    L.ext = { x: W * 0.565, y: band, w: 110 * s, h: 50 * s };
    L.park = { x: W * 0.565, y: band - 84 * s };
    L.gpu = { cx: W * 0.958, cy: band, w: 62 * s, h: 60 * s };
    L.device = { x0: W * 0.648, x1: L.gpu.cx - L.gpu.w / 2 - 6 * s, y: band, h: 26 * s };
    L.entry = { x: L.device.x0 + 8 * s, y: band };
  }
  relayout();
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(canvas);
  else window.addEventListener("resize", relayout);

  /* ---------- the script ---------- */
  const CODE = [
    "# mamba block · cuda · bf16",
    "x = rand(B, D, L, bf16)",
    "w = rand(D, 4); b = rand(D)",
    "",
    "y = causal_conv1d_fn(x, w, b)",
    "",
    "x2 = rand(B, D, 2*L, bf16)",
    "y2 = causal_conv1d_fn(x2, w, b)",
    "",
    "y3 = causal_conv1d_fn(x, w, b,",
    "      activation=\"silu\")",
    "",
    "y4 = causal_conv1d_fn(x, w, b,",
    "      activation=\"silu\")",
    "",
    "# ── restart python ──",
    "y = causal_conv1d_fn(x, w, b)",
  ];

  // the real config -> -D mapping from fwd/_jit.py (first five shown)
  const DEFS_BASE = [
    { k: "DTYPE", v: "bfloat16" },
    { k: "WIDTH", v: "4" },
    { k: "HAS_BIAS", v: "true" },
    { k: "APPLY_SILU", v: "false" },
    { k: "CHANNEL_LAST", v: "false" },
    { k: "+6 more", v: "" },
  ];
  const KEY0 = "bf16_w4_hb1_silu0";
  const KEY1 = "bf16_w4_hb1_silu1";
  const AMBIENT = ["matmul", "add", "ln", "rope", "softmax", "mul"];

  /* ---------- world ---------- */
  let world;
  function freshWorld() {
    return {
      time: 0, clock: 0, si: 0,
      flyers: [], sparks: [], stream: [],
      strip: [],                 // defines chips {k,v,on,pop,hl}
      lruKeys: 0, lruFlash: 0, lruFlashCol: null, lruSweep: 0,
      shelf: [],                 // {name1,name2,flash,flashCol}
      compiler: { active: false, start: 0, dur: 0, label: "" },
      extLoaded: 0, extPulse: 0,
      gpu: { busy: null, flash: 0, flashCol: null },
      cur: 0, blocked: false, ann: {},   // ann[line] = {text,color,alpha}
      counters: { compiles: 0, lru: 0, disk: 0, launch: 0 },
      ambientAt: 0.8,
      fade: 0, fading: false, fadeDir: 0,
    };
  }
  world = freshWorld();

  function fly(label, color, from, to, arc, dur, onArrive, opts) {
    const f = {
      label, color, x: from.x, y: from.y, alpha: 0, scale: 0.4,
      mono: opts && opts.mono, small: opts && opts.small,
      path: { p0: { x: from.x, y: from.y },
              p1: { x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 - arc },
              p2: { x: to.x, y: to.y }, t: 0, dur },
      onArrive, hold: (opts && opts.hold) || 0, dead: false,
    };
    world.flyers.push(f);
    return f;
  }
  function spawnSpark(x, y, tx, ty, text) {
    world.sparks.push({ x, y, tx, ty, t: 0, dur: 0.55, text: text || ".so" });
  }
  function pushKernel(label, isConv) {
    const tail = world.stream[world.stream.length - 1];
    const kw = Math.max(26, label.length * 5.6 + 10) * L.s;
    const x0 = tail ? Math.min(L.entry.x, tail.x - tail.w - 4 * L.s) : L.entry.x;
    world.stream.push({ label, isConv, cost: isConv ? 1.4 : 0.8 + Math.random() * 0.8,
                        w: kw, x: x0, alpha: 0 });
    if (isConv) world.counters.launch += 1;
  }
  function annotate(lineIdx, text, color) {
    world.ann[lineIdx] = { text, color, alpha: 0 };
  }
  function stripSet(defs, hlKey) {
    world.strip = defs.map(d => ({ ...d, on: false, pop: 0, hl: d.k === hlKey }));
  }
  // measured flow layout: chips pack left-to-right and wrap so they never
  // overlap, each row centered in the strip
  function stripLayout() {
    const s = L.s, gap = 6 * s, maxW = L.strip.x1 - L.strip.x0;
    const rows = [[]];
    let wsum = 0;
    world.strip.forEach((c, i) => {
      const txt = c.v ? c.k + "=" + c.v : c.k;
      const w = (txt.length * 4.6 + 12) * s;
      let row = rows[rows.length - 1];
      if (row.length && wsum + gap + w > maxW) { rows.push(row = []); wsum = 0; }
      wsum += (row.length ? gap : 0) + w;
      row.push({ i, w });
    });
    const pos = {};
    rows.forEach((row, r) => {
      const total = row.reduce((a, b) => a + b.w, 0) + gap * (row.length - 1);
      let x = (L.strip.x0 + L.strip.x1) / 2 - total / 2;
      for (const it of row) {
        pos[it.i] = { x: x + it.w / 2, y: L.strip.y + r * 19 * s, w: it.w };
        x += it.w + gap;
      }
    });
    return pos;
  }
  function stripChipPos(i) {
    const p = stripLayout()[i];
    return p ? { x: p.x, y: p.y } : { x: (L.strip.x0 + L.strip.x1) / 2, y: L.strip.y };
  }
  function shelfCardPos(i) {
    const cw = 74 * L.s;
    return { x: L.shelf.x0 + 10 * L.s + i * (cw + 8 * L.s) + cw / 2, y: L.shelf.y };
  }

  /* ---------- the director ---------- */
  const noteEl = document.getElementById("stageNote");
  let noteCur = "";
  function setNote(s) { if (s !== noteCur) { noteCur = s; noteEl.textContent = s; } }

  const codeLineY = (i) => L.code.y0 + 14 * L.s + i * L.lineH;
  const arrowPt = () => ({ x: L.code.x1 - 4, y: codeLineY(world.cur) });

  // One call = config chips -> defines strip -> key -> lru -> (disk -> compile ->
  // shelf -> dlopen) -> extension; runtime chips park at the extension early.
  function runtimeChips(delay) {
    setTimeoutStep(delay, () => {
      const s = L.s;
      fly("x·w·b·y data_ptr()", T.norm, arrowPt(), { x: L.park.x - 40 * s, y: L.park.y }, 70 * s, 0.9, null, { mono: true, hold: 99 });
    });
    setTimeoutStep(delay + 0.25, () => {
      const s = L.s;
      fly("shapes · strides", T.norm, arrowPt(), { x: L.park.x + 30 * s, y: L.park.y + 16 * s }, 80 * s, 0.9, null, { mono: true, hold: 99 });
    });
    setTimeoutStep(delay + 0.5, () => {
      const s = L.s;
      fly("cuda_stream ↯", T.norm, arrowPt(), { x: L.park.x + 86 * s, y: L.park.y }, 92 * s, 0.9, null, { mono: true, hold: 99 });
    });
  }
  function chipsEnterExt() {
    // parked runtime chips drop into the extension box
    for (const f of world.flyers) {
      if (f.hold >= 99 && !f.path) {
        f.hold = 0;
        f.path = { p0: { x: f.x, y: f.y },
                   p1: { x: (f.x + L.ext.x) / 2, y: (f.y + L.ext.y) / 2 - 10 * L.s },
                   p2: { x: L.ext.x, y: L.ext.y }, t: 0, dur: 0.35 };
        f.onArrive = (ff) => { ff.dead = true; };
      }
    }
    world.extPulse = 1;
  }

  // director plumbing: steps fire once when clock passes their time
  let STEPS = [], TOTAL = 0;
  let pendingTimeouts = [];   // steps registered relative to "now" while building
  function setTimeoutStep(d, fn) { pendingTimeouts.push({ t: _cursor + d, fn }); }
  let _cursor = 0;
  function buildTimeline() {
    STEPS = []; pendingTimeouts = []; _cursor = 0;
    const at = (fn) => STEPS.push({ t: _cursor, fn });
    const wait = (d) => { _cursor += d; };

    function assembleDefines(defs, hlKey, slow) {
      at(() => stripSet(defs, hlKey));
      const per = slow ? 0.22 : 0.1;
      for (let i = 0; i < defs.length; i++) {
        const idx = i;
        at(() => {
          const c = world.strip[idx]; if (c) { c.on = true; c.pop = 1; }
          if (idx === 0) setNote("the wrapper reads dtype, width and flags off the call — never shapes");
        });
        wait(per);
      }
    }
    function keyToLru(key, hit) {
      at(() => {
        fly(key, T.amber, { x: (L.strip.x0 + L.strip.x1) / 2, y: L.strip.y - 10 * L.s },
            L.lru, 30 * L.s, 0.5, (f) => {
          f.dead = true;
          world.lruFlash = 1;
          world.lruFlashCol = hit ? T.go : T.drain;
          if (hit) { world.counters.lru += 1; }
        });
      });
      wait(0.65);
    }
    function launchBeat(note) {
      at(() => { chipsEnterExt(); if (note) setNote(note); });
      wait(0.5);
      at(() => {
        world.extPulse = 1;
        fly("conv1d_fwd", T.mm, L.ext, L.entry, -26 * L.s, 0.45, (f) => {
          f.dead = true;
          pushKernel("conv1d_fwd", true);
        });
      });
      wait(0.6);
    }
    function callChip(lineIdx) {
      at(() => {
        world.cur = lineIdx;
        fly("call fwd", T.muted, arrowPt(), L.wrapper, 26 * L.s, 0.55,
            (f) => { f.dead = true; });
      });
      wait(0.6);
    }

    /* ---- boot ---- */
    at(() => { world.cur = 0; setNote("cold start — this machine has no cache yet (backend cuda · arch sm90)"); });
    wait(0.7);
    at(() => { world.cur = 1; }); wait(0.35);
    at(() => { world.cur = 2; }); wait(0.45);

    /* ---- act 1: cold call ---- */
    at(() => { world.cur = 4; world.blocked = true; });
    callChip(4);
    runtimeChips(0.1);

    at(() => setNote("compile once per machine and config — not per process, and never per shape"));
    wait(2.2);

    // absorb the setTimeoutStep registrations into the main list
    STEPS = STEPS.concat(pendingTimeouts.map(p => ({ t: p.t, fn: p.fn })));
    STEPS.sort((a, b) => a.t - b.t);
    TOTAL = _cursor + 0.5;
  }
  buildTimeline();
  // rebuild positions-dependent closures on resize: timeline stores only fns
  // that read L at fire time, so nothing to do here.

  /* ---------- update ---------- */
  function update(dt) {
    world.time += dt;

    if (world.fading) {
      world.fade = clamp(world.fade + world.fadeDir * dt * 1.3, 0, 1);
      if (world.fade >= 1 && world.fadeDir > 0) {
        const keep = world.fade;
        world = freshWorld();
        world.fade = keep; world.fading = true; world.fadeDir = -1;
        setNote("loop · restarting cold");
      } else if (world.fade <= 0 && world.fadeDir < 0) {
        world.fading = false; world.fadeDir = 0;
      }
    } else {
      world.clock += dt;
      while (world.si < STEPS.length && world.clock >= STEPS[world.si].t) {
        STEPS[world.si].fn();
        world.si += 1;
      }
      if (world.clock >= TOTAL && !world.fading) {
        world.fading = true; world.fadeDir = 1;
      }
    }

    // ambient torch kernels keep flowing while python isn't blocked in our call
    if (!world.blocked && world.time >= world.ambientAt) {
      world.ambientAt = world.time + 0.75 + Math.random() * 0.7;
      pushKernel(AMBIENT[(Math.random() * AMBIENT.length) | 0], false);
    }

    // flyers
    for (const f of world.flyers) {
      f.alpha = glide(f.alpha, 1, dt, 8);
      f.scale = glide(f.scale, 1, dt, 8);
      if (f.path) {
        f.path.t += dt / f.path.dur;
        const t = easeInOut(clamp(f.path.t, 0, 1));
        const pt = qBezier(f.path.p0, f.path.p1, f.path.p2, t);
        f.x = pt.x; f.y = pt.y;
        if (f.path.t >= 1) {
          f.path = null;
          if (f.onArrive) f.onArrive(f);
        }
      }
    }
    world.flyers = world.flyers.filter(f => !f.dead);

    // defines strip pops
    for (const c of world.strip) if (c.pop) c.pop = Math.max(0, c.pop - dt * 2.2);

    // lru flash / sweep
    world.lruFlash = Math.max(0, world.lruFlash - dt * 1.6);
    world.lruSweep = Math.max(0, world.lruSweep - dt * 0.9);

    // shelf flashes
    for (const card of world.shelf) card.flash = Math.max(0, card.flash - dt * 1.2);

    world.extPulse = Math.max(0, world.extPulse - dt * 1.8);

    // device stream pack
    let edge = L.device.x1 - 4;
    let ahead = null;
    for (const k of world.stream) {
      k.w = Math.max(26, k.label.length * 5.6 + 10) * L.s;
      k.txRight = edge;
      edge -= k.w + 4 * L.s;
      const cap = ahead ? ahead.x - ahead.w - 4 * L.s : Infinity;
      k.x = Math.max(k.x, Math.min(k.x + W * 0.4 * dt, k.txRight, cap));
      k.alpha = glide(k.alpha, 1, dt, 8);
      ahead = k;
    }

    // GPU: one kernel at a time
    const gpu = world.gpu;
    if (!gpu.busy && world.stream.length) {
      const front = world.stream[0];
      if (front.x >= front.txRight - 1 && front.txRight >= L.device.x1 - 5) {
        world.stream.shift();
        gpu.busy = { label: front.label, isConv: front.isConv, t: 0,
                     dur: (0.14 + front.cost * 0.14) / (1 + 0.3 * world.stream.length) };
      }
    }
    if (gpu.busy) {
      gpu.busy.t += dt;
      if (gpu.busy.t >= gpu.busy.dur) {
        gpu.flash = 1;
        gpu.flashCol = gpu.busy.isConv ? T.mm : T.muted;
        gpu.busy = null;
      }
    }
    gpu.flash = Math.max(0, gpu.flash - dt * 2.2);

    // sparks & annotations
    for (const s of world.sparks) s.t += dt / s.dur;
    world.sparks = world.sparks.filter(s => s.t < 1);
    for (const k in world.ann) world.ann[k].alpha = glide(world.ann[k].alpha, 1, dt, 5);

    // HUD
    hudCompiles.textContent = world.counters.compiles;
    hudSo.textContent = world.shelf.length;
    hudLru.textContent = world.counters.lru;
    hudDisk.textContent = world.counters.disk;
    hudLaunch.textContent = world.counters.launch;
  }

  /* ---------- draw ---------- */
  function drawStationBox(st, title, sub) {
    ctx.fillStyle = T.panel2;
    ctx.strokeStyle = T.line;
    ctx.lineWidth = Math.max(1, L.s);
    rr(st.x - st.w / 2, st.y - st.h / 2, st.w, st.h, 9 * L.s);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = T.ink;
    ctx.font = fpx(10, "600");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(title, st.x, st.y - (sub ? 6 * L.s : 0));
    if (sub) {
      ctx.fillStyle = T.muted;
      ctx.font = fpx(8);
      ctx.fillText(sub, st.x, st.y + 8 * L.s);
    }
  }
  function drawLabel(x, y, text, align) {
    ctx.fillStyle = T.muted;
    ctx.font = fpx(9, "600");
    ctx.textAlign = align || "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText(text.toUpperCase(), x, y);
  }
  function drawRail(p0, p1, arc) {
    ctx.strokeStyle = T.lineSoft;
    ctx.lineWidth = 1;
    ctx.setLineDash([1, 5]);
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.quadraticCurveTo((p0.x + p1.x) / 2, (p0.y + p1.y) / 2 - arc, p1.x, p1.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawCode() {
    const C = L.code, s = L.s;
    ctx.fillStyle = T.codeBg;
    ctx.strokeStyle = T.line;
    ctx.lineWidth = Math.max(1, s);
    rr(C.x0, C.y0, C.x1 - C.x0, C.y1 - C.y0, 10 * s);
    ctx.fill(); ctx.stroke();
    drawLabel((C.x0 + C.x1) / 2, C.y0 - 8 * s, "pytorch");

    ctx.textBaseline = "middle";
    for (let i = 0; i < CODE.length; i++) {
      const y = codeLineY(i);
      const isCur = i === world.cur;
      if (isCur) {
        ctx.fillStyle = world.blocked ? withAlpha(T.drain, 0.14) : T.amberSoft;
        rr(C.x0 + 4 * s, y - L.lineH / 2 + 1, C.x1 - C.x0 - 8 * s, L.lineH - 1, 4 * s);
        ctx.fill();
        ctx.fillStyle = world.blocked ? T.drain : T.amber;
        ctx.beginPath();
        ctx.moveTo(C.x0 + 6 * s, y - 4 * s);
        ctx.lineTo(C.x0 + 13 * s, y);
        ctx.lineTo(C.x0 + 6 * s, y + 4 * s);
        ctx.closePath();
        ctx.fill();
      }
      const isComment = CODE[i].startsWith("#");
      ctx.globalAlpha = isCur ? 1 : 0.82;
      ctx.fillStyle = isComment ? T.muted : T.ink;
      ctx.font = fpx(9, isCur ? "600" : "");
      ctx.textAlign = "left";
      ctx.fillText(CODE[i], C.x0 + 18 * s, y);
      ctx.globalAlpha = 1;
      const a = world.ann[i];
      if (a) {
        ctx.globalAlpha = a.alpha;
        ctx.fillStyle = a.color;
        ctx.font = fpx(8.5, "600");
        ctx.textAlign = "right";
        ctx.fillText(a.text, C.x1 - 8 * s, y);
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawStrip() {
    if (!world.strip.length) return;
    const s = L.s;
    drawLabel((L.strip.x0 + L.strip.x1) / 2, L.strip.y - 16 * s, "-D defines · the cache key");
    const pos = stripLayout();
    for (let i = 0; i < world.strip.length; i++) {
      const c = world.strip[i];
      if (!c.on) continue;
      const p = pos[i];
      if (!p) continue;
      const txt = c.v ? c.k + "=" + c.v : c.k;
      const pop = 1 + c.pop * 0.15;
      const w = p.w * pop;
      const h = 14 * s * pop;
      const col = c.hl ? T.drain : T.amber;
      ctx.fillStyle = withAlpha(col, c.hl ? 0.22 : 0.13);
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.1 * s;
      rr(p.x - w / 2, p.y - h / 2, w, h, 5 * s);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = col;
      ctx.font = fpx(7, "600");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(txt, p.x, p.y + 0.5);
    }
  }

  function drawShelf() {
    const s = L.s;
    ctx.strokeStyle = T.line;
    ctx.lineWidth = Math.max(1, s);
    ctx.fillStyle = withAlpha(T.panel2, 0.5);
    rr(L.shelf.x0, L.shelf.y - L.shelf.h / 2, L.shelf.x1 - L.shelf.x0, L.shelf.h, 8 * s);
    ctx.fill(); ctx.stroke();
    drawLabel(L.shelf.x0, L.shelf.y - L.shelf.h / 2 - 8 * s, "~/.cache/causal_conv1d_mojo/fwd/cuda/sm90/", "left");
    if (!world.shelf.length) {
      ctx.fillStyle = T.muted;
      ctx.globalAlpha = 0.6;
      ctx.font = fpx(8);
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("empty", (L.shelf.x0 + L.shelf.x1) / 2, L.shelf.y);
      ctx.globalAlpha = 1;
    }
    for (let i = 0; i < world.shelf.length; i++) {
      const card = world.shelf[i];
      const p = shelfCardPos(i);
      const cw = 74 * s, chh = 34 * s;
      ctx.fillStyle = T.panel2;
      ctx.strokeStyle = card.flash > 0 ? (card.flashCol || T.amber) : T.amber;
      ctx.lineWidth = (card.flash > 0 ? 2 : 1.2) * s;
      if (card.flash > 0) { ctx.shadowColor = card.flashCol || T.amber; ctx.shadowBlur = 14 * card.flash * s; }
      rr(p.x - cw / 2, p.y - chh / 2, cw, chh, 6 * s);
      ctx.fill(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = T.ink;
      ctx.font = fpx(6.6, "600");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(card.name1, p.x, p.y - 5 * s);
      ctx.fillStyle = T.muted;
      ctx.font = fpx(6.6);
      ctx.fillText(card.name2, p.x, p.y + 6 * s);
    }
  }

  function drawCompiler() {
    const C = L.compiler, s = L.s, cp = world.compiler;
    drawLabel(C.x, C.y - C.r - 12 * s, "mojo build");
    ctx.beginPath();
    ctx.arc(C.x, C.y, C.r, 0, Math.PI * 2);
    ctx.strokeStyle = T.line; ctx.lineWidth = 2.4 * s; ctx.stroke();
    if (cp.active) {
      const fr = clamp((world.clock - cp.start) / cp.dur, 0, 1);
      ctx.beginPath();
      ctx.arc(C.x, C.y, C.r, -Math.PI / 2, -Math.PI / 2 + fr * Math.PI * 2);
      ctx.strokeStyle = T.amber; ctx.lineWidth = 3 * s; ctx.lineCap = "round"; ctx.stroke();
      ctx.lineCap = "butt";
      const spin = world.time * 2.1;
      ctx.beginPath();
      ctx.arc(C.x + Math.cos(spin) * (C.r - 5 * s), C.y + Math.sin(spin) * (C.r - 5 * s), 1.5 * s, 0, Math.PI * 2);
      ctx.fillStyle = T.amber; ctx.fill();
      ctx.fillStyle = T.muted;
      ctx.font = fpx(7.5);
      ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
      ctx.fillText(cp.label, C.x, C.y + C.r + 14 * s);
    }
  }

  function drawLruExt() {
    const s = L.s;
    drawStationBox(L.wrapper, "python wrapper", "inspect args · empty_like");
    drawStationBox(L.lru, "lru_cache", world.lruKeys + (world.lruKeys === 1 ? " key" : " keys"));
    if (world.lruFlash > 0) {
      ctx.strokeStyle = withAlpha(world.lruFlashCol || T.go, world.lruFlash);
      ctx.lineWidth = 2.4 * s;
      rr(L.lru.x - L.lru.w / 2 - 3 * s, L.lru.y - L.lru.h / 2 - 3 * s, L.lru.w + 6 * s, L.lru.h + 6 * s, 11 * s);
      ctx.stroke();
    }
    if (world.lruSweep > 0) {
      ctx.fillStyle = withAlpha(T.drain, world.lruSweep * 0.25);
      rr(L.lru.x - L.lru.w / 2, L.lru.y - L.lru.h / 2, L.lru.w, L.lru.h, 9 * s);
      ctx.fill();
    }
    // extension box
    const E = L.ext;
    ctx.fillStyle = T.panel2;
    ctx.strokeStyle = world.extLoaded ? T.mm : T.line;
    ctx.lineWidth = (world.extLoaded ? 1.6 : 1) * s;
    if (world.extPulse > 0) { ctx.shadowColor = T.mm; ctx.shadowBlur = 16 * world.extPulse * s; }
    rr(E.x - E.w / 2, E.y - E.h / 2, E.w, E.h, 9 * s);
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = T.ink;
    ctx.font = fpx(10, "600");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("variant .so · mojo", E.x, E.y - 7 * s);
    ctx.fillStyle = T.muted;
    ctx.font = fpx(7.5);
    ctx.fillText(world.extLoaded ? "external stream · enqueue" : "not loaded", E.x, E.y + 8 * s);
    drawLabel(L.park.x, L.park.y - 22 * L.s, "runtime args · every call");
  }

  function drawStream() {
    const s = L.s;
    drawLabel(L.device.x0, L.device.y - 22 * s, "torch cuda stream", "left");
    ctx.strokeStyle = T.line;
    ctx.lineWidth = Math.max(1, s);
    rr(L.device.x0, L.device.y - L.device.h / 2, L.device.x1 - L.device.x0, L.device.h, 7 * s);
    ctx.stroke();
    const g2 = (Math.sin(world.time * 3.1) + 1) / 2;
    ctx.beginPath();
    ctx.arc(L.entry.x, L.entry.y, (2.5 + g2 * 1.2) * s, 0, Math.PI * 2);
    ctx.fillStyle = withAlpha(T.go, 0.5 + g2 * 0.4);
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    rr(L.device.x0 + 1, L.device.y - L.device.h / 2 + 1, L.device.x1 - L.device.x0 - 2, L.device.h - 2, 6 * s);
    ctx.clip();
    for (const k of world.stream) {
      ctx.globalAlpha = k.alpha * (k.isConv ? 0.96 : 0.6);
      ctx.fillStyle = k.isConv ? T.mm : T.muted;
      rr(k.x - k.w, L.device.y - 8 * s, k.w, 16 * s, 4 * s);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = fpx(7.5, "600");
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(k.label, k.x - k.w / 2, L.device.y + 0.5);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // GPU
    const G = L.gpu, gpu = world.gpu;
    ctx.fillStyle = T.panel2;
    ctx.strokeStyle = T.line;
    ctx.lineWidth = 1.2 * s;
    rr(G.cx - G.w / 2, G.cy - G.h / 2, G.w, G.h, 10 * s);
    ctx.fill(); ctx.stroke();
    const ringY = G.cy - 9 * s, ringR = 11 * s;
    ctx.beginPath();
    ctx.arc(G.cx, ringY, ringR, 0, Math.PI * 2);
    ctx.strokeStyle = T.line; ctx.lineWidth = 2.6 * s; ctx.stroke();
    if (gpu.busy) {
      const fr = clamp(gpu.busy.t / gpu.busy.dur, 0, 1);
      const col = gpu.busy.isConv ? T.mm : T.muted;
      ctx.beginPath();
      ctx.arc(G.cx, ringY, ringR, -Math.PI / 2, -Math.PI / 2 + fr * Math.PI * 2);
      ctx.strokeStyle = col; ctx.lineWidth = 3 * s; ctx.lineCap = "round"; ctx.stroke();
      ctx.lineCap = "butt";
      const spin = world.time * 5;
      ctx.beginPath();
      ctx.arc(G.cx + Math.cos(spin) * (ringR - 4.5 * s), ringY + Math.sin(spin) * (ringR - 4.5 * s), 1.5 * s, 0, Math.PI * 2);
      ctx.fillStyle = col; ctx.fill();
      ctx.beginPath();
      ctx.arc(G.cx, ringY, 3 * s, 0, Math.PI * 2);
      ctx.fillStyle = col; ctx.fill();
    } else {
      const idlePulse = (Math.sin(world.time * 2.2) + 1) / 2;
      ctx.beginPath();
      ctx.arc(G.cx, ringY, 3 * s, 0, Math.PI * 2);
      ctx.fillStyle = withAlpha(T.muted, 0.3 + idlePulse * 0.3);
      ctx.fill();
    }
    if (gpu.flash > 0) {
      ctx.beginPath();
      ctx.arc(G.cx, ringY, ringR + (1 - gpu.flash) * 10 * s, 0, Math.PI * 2);
      ctx.strokeStyle = withAlpha(gpu.flashCol || T.go, gpu.flash * 0.8);
      ctx.lineWidth = 2 * s; ctx.stroke();
    }
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (gpu.busy) {
      ctx.fillStyle = gpu.busy.isConv ? T.mm : T.muted;
      ctx.font = fpx(7.5, "600");
      ctx.fillText(gpu.busy.label, G.cx, G.cy + 9 * s);
    } else {
      ctx.fillStyle = T.muted;
      ctx.font = fpx(7.5);
      ctx.fillText("idle", G.cx, G.cy + 9 * s);
    }
    ctx.fillStyle = T.ink;
    ctx.font = fpx(9.5, "700");
    ctx.fillText("GPU", G.cx, G.cy + G.h / 2 - 9 * s);
  }

  function drawFlyer(f) {
    const s = L.s;
    const w = Math.max(26, f.label.length * (f.small ? 4.4 : 5.4) + 10) * f.scale * s;
    const h = (f.small ? 13 : 16) * f.scale * s;
    ctx.globalAlpha = f.alpha;
    ctx.fillStyle = withAlpha(f.color, 0.13);
    ctx.strokeStyle = f.color;
    ctx.lineWidth = 1.2 * s;
    rr(f.x - w / 2, f.y - h / 2, w, h, 5 * s);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = f.color;
    ctx.font = fpx(f.small ? 6.8 : 7.6, "600");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(f.label, f.x, f.y + 0.5);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = T.bg;
    ctx.fillRect(0, 0, W, H);
    const s = L.s;

    // rails
    drawRail({ x: L.code.x1 - 4, y: L.band }, L.wrapper, 10 * s);
    drawRail(L.wrapper, L.lru, 6 * s);
    drawRail(L.lru, L.ext, 34 * s);
    drawRail(L.lru, { x: (L.shelf.x0 + L.shelf.x1) / 2, y: L.shelf.y - L.shelf.h / 2 }, -16 * s);
    drawRail({ x: (L.strip.x0 + L.strip.x1) / 2, y: L.strip.y }, L.compiler, 60 * s);
    drawRail(L.compiler, { x: (L.shelf.x0 + L.shelf.x1) / 2, y: L.shelf.y - L.shelf.h / 2 }, 40 * s);
    drawRail(L.ext, L.entry, -18 * s);
    drawRail({ x: L.code.x1 - 4, y: L.code.y0 + 40 * s }, L.park, 70 * s);

    drawCode();
    drawLruExt();
    drawStrip();
    drawShelf();
    drawCompiler();
    drawStream();

    // sparks
    for (const sp of world.sparks) {
      const t = easeOut(clamp(sp.t, 0, 1));
      const pt = qBezier({ x: sp.x, y: sp.y }, { x: (sp.x + sp.tx) / 2 + 12 * s, y: (sp.y + sp.ty) / 2 - 20 * s }, { x: sp.tx, y: sp.ty }, t);
      ctx.globalAlpha = 1 - t * 0.4;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 2.6 * s, 0, Math.PI * 2);
      ctx.fillStyle = T.amber; ctx.fill();
      ctx.font = fpx(7.5);
      ctx.fillStyle = T.amber;
      ctx.textAlign = "left";
      ctx.fillText(sp.text, pt.x + 5 * s, pt.y + 3 * s);
      ctx.globalAlpha = 1;
    }

    for (const f of world.flyers) drawFlyer(f);

    if (world.fade > 0) {
      ctx.fillStyle = withAlpha(T.bg[0] === "#" ? T.bg : "#000000", world.fade);
      ctx.fillRect(0, 0, W, H);
    }
  }

  /* ---------- loop / controls ---------- */
  const hudCompiles = document.getElementById("hud-compiles"),
        hudSo = document.getElementById("hud-so"),
        hudLru = document.getElementById("hud-lru"),
        hudDisk = document.getElementById("hud-disk"),
        hudLaunch = document.getElementById("hud-launch");
  const btnPlay = document.getElementById("btnPlay");
  const btnSpeed = document.getElementById("btnSpeed");
  const btnRestart = document.getElementById("btnRestart");
  const overlay = document.getElementById("playOverlay");

  const SPEEDS = [1, 1.6, 0.6, 0.2];
  let speedIdx = 0;
  btnSpeed.addEventListener("click", () => {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    btnSpeed.textContent = SPEEDS[speedIdx] + "×";
  });
  btnRestart.addEventListener("click", () => {
    world = freshWorld();
    setNote("cold start — no cache for this machine yet");
    if (!running) { draw(); }
  });

  const btnFull = document.getElementById("btnFull");
  const stageCard = document.getElementById("stageCard");
  function fullIsOn() {
    return !!document.fullscreenElement || stageCard.classList.contains("pseudo-full");
  }
  function syncFullBtn() {
    btnFull.textContent = fullIsOn() ? "✕ exit fullscreen" : "⛶ fullscreen";
  }
  btnFull.addEventListener("click", async () => {
    if (fullIsOn()) {
      if (document.fullscreenElement) { try { await document.exitFullscreen(); } catch (e) {} }
      stageCard.classList.remove("pseudo-full");
      syncFullBtn();
      return;
    }
    let native = false;
    if (stageCard.requestFullscreen) {
      try { await stageCard.requestFullscreen(); native = true; } catch (e) {}
    }
    if (!native) stageCard.classList.add("pseudo-full");
    syncFullBtn();
  });
  document.addEventListener("fullscreenchange", syncFullBtn);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && stageCard.classList.contains("pseudo-full")) {
      stageCard.classList.remove("pseudo-full");
      syncFullBtn();
    }
  });

  let running = true, last = null, raf = 0;
  function frame(ts) {
    if (last == null) last = ts;
    let dt = Math.min((ts - last) / 1000, 0.05) * SPEEDS[speedIdx];
    last = ts;
    update(dt);
    draw();
    if (running) raf = requestAnimationFrame(frame);
  }
  function togglePlay(force) {
    running = force !== undefined ? force : !running;
    btnPlay.textContent = running ? "⏸ pause" : "▶ play";
    btnPlay.setAttribute("aria-pressed", String(running));
    overlay.classList.toggle("visible", !running && neverStarted);
    if (running) { neverStarted = false; overlay.classList.remove("visible"); last = null; raf = requestAnimationFrame(frame); }
    else cancelAnimationFrame(raf);
  }
  btnPlay.addEventListener("click", () => togglePlay());
  document.getElementById("bigPlay").addEventListener("click", () => togglePlay(true));
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && running) { cancelAnimationFrame(raf); }
    else if (!document.hidden && running) { last = null; raf = requestAnimationFrame(frame); }
  });

  let neverStarted = false;
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) {
    neverStarted = true;
    running = false;
    btnPlay.textContent = "▶ play";
    btnPlay.setAttribute("aria-pressed", "false");
    overlay.classList.add("visible");
    draw();
  } else {
    raf = requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
