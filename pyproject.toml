[project]
name = "causal-conv1d-mojo"
version = "0.0.4"
description = "A wheel for causal-conv1d that works everywhere."
readme = "README.md"
# Pinned to 3.13: torch 2.8.0 ships prebuilt cp313 wheels but not cp314.
# Bump once those land.
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2,<3",
    "mojo-compiler==1.0.0b3.dev2026062306",
    "mojo-compiler-mojo-libs==1.0.0b3.dev2026062306",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
mojo-compiler = [
    { index = "modular-nightly" },
]
mojo-compiler-mojo-libs = [
    { index = "modular-nightly" },
]

[[tool.uv.index]]
name = "modular-nightly"
url = "https://whl.modular.com/nightly/simple/"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"causal_conv1d_mojo" = ["**/*.mojo"]
